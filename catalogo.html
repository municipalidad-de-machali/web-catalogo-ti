<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo TI</title>
    <link rel="icon" type="image/png" href="images/color_transparente.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header id="header-placeholder"></header>
    <main class="flex-grow-1">
        <div class="container-fluid bg-mach-primary text-white py-5">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <h1 id="categoria-titulo" class="fw-bold">Categoría del Servicio TI</h1>
                        <p id="categoria-descripcion" class="lead"></p>
                    </div>
                </div>
            </div> 
        </div>
        <div class="container mt-4">
            <div id="servicios-lista" class="row g-4"></div>
        </div>
        <div class="modal fade" id="modalServicio" tabindex="-1" aria-labelledby="modalServicioTitulo" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content card-border-primary">
                    <div class="modal-header bg-mach-primary text-white">
                        <h5 class="modal-title fw-bold" id="modalServicioTitulo"></h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body text-secondary" id="modalServicioDescripcion"></div>
                    <div class="modal-footer">
                        <a href="https://machali.freshdesk.com/support/tickets/new" target="_blank" class="btn btn-danger m-0">Enviar Solicitud</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder" class="py-4 bg-mach-primary text-white"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/datosServicios.js"></script>
    <script src="js/categoriasServicios.js"></script>
    <script src="js/iconosServicios.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
