<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio de Impresión</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <script src="script.js"></script>

    <div id="header-placeholder"></div>
    
<div class="main-content">

<div id="serviceModal" class="modal-overlay">
  <div class="modal-content">
    

    <section class="catalogo-box">
    <div class="menu-servicios">
        <h2 class="titulo-seccion">Servicios</h2>
        <button class="btn-servicio" onclick="cambiarInfo('insimp')">Instalacion de Impresoras, escaneres y plotters</button>
        <button class="btn-servicio" onclick="cambiarInfo('consimp')">Gestión de Consumibles para equipos de Impresión</button>
        <button class="btn-servicio" onclick="cambiarInfo('confimp')">Gestion de equipos de impresion</button>
        <button class="btn-servicio" onclick="cambiarInfo('mantimp')">Mantencion de Impresoras, escaneres y plotters</button>
        </div>

    <div class="detalle-servicio" id="cuadro-detalle">
        <h2 id="info-titulo">Servicio de Impresión</h2>
        <p id="info-texto">Selecciona un servicio de la izquierda para ver los detalles.</p>
        <button class="btn-solicitar">Enviar Solicitud</button>
    </div>
</section>
    

  </div>
</div>
</div>

<div id="footer-placeholder"></div>

</html>
